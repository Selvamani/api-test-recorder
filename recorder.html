<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Test Recorder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; background: #0c0c0c; color: #e8e8e8;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .header {
    padding: 10px 16px; border-bottom: 1px solid #1e1e1e;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: #111;
  }
  .logo { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
  .logo span { color: #1D9E75; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #2a2a2a; flex-shrink: 0; }
  .rec-dot.on { background: #E24B4A; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }
  .rec-label { font-size: 11px; color: #555; }
  .rec-label.on { color: #1D9E75; }
  .timer { font-size: 12px; color: #444; font-variant-numeric: tabular-nums; }
  .controls {
    padding: 8px 16px; display: flex; gap: 6px; align-items: center;
    border-bottom: 1px solid #1e1e1e; flex-shrink: 0; background: #111; flex-wrap: wrap;
  }
  button {
    cursor: pointer; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 6px 14px; font-size: 12px; font-weight: 500;
    background: #1a1a1a; color: #ccc; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #222; color: #fff; border-color: #3a3a3a; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  button.primary:hover:not(:disabled) { background: #178f68; }
  button.danger { background: #A32D2D; color: #fff; border-color: #A32D2D; }
  button.danger:hover:not(:disabled) { background: #791F1F; }
  .stats {
    display: flex; gap: 0; flex-shrink: 0; flex-wrap: wrap;
    border-bottom: 1px solid #1e1e1e; background: #0e0e0e;
  }
  .stat { padding: 7px 16px; border-right: 1px solid #1a1a1a; }
  .stat:last-child { border-right: none; }
  .stat-n { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.1; }
  .stat-l { font-size: 10px; color: #444; margin-top: 1px; }
  .note-bar {
    padding: 7px 16px; display: flex; gap: 6px;
    border-bottom: 1px solid #1e1e1e; flex-shrink: 0; background: #111;
  }
  .note-bar input {
    flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 5px 10px; color: #e8e8e8; font-size: 12px; outline: none;
  }
  .note-bar input:focus { border-color: #3a3a3a; }
  .main { display: grid; grid-template-columns: 300px 1fr; flex: 1; overflow: hidden; }
  .timeline-pane { border-right: 1px solid #1e1e1e; display: flex; flex-direction: column; overflow: hidden; }
  .pane-header {
    padding: 7px 12px; border-bottom: 1px solid #1e1e1e;
    font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase;
    letter-spacing: .5px; display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; background: #0e0e0e;
  }
  .filter-tabs { display: flex; gap: 2px; margin-left: auto; }
  .ftab { font-size: 10px; padding: 2px 7px; border-radius: 4px; cursor: pointer; color: #555; font-weight: 500; }
  .ftab:hover { color: #aaa; }
  .ftab.active { background: #1e1e1e; color: #ccc; }
  .timeline-list { flex: 1; overflow-y: auto; }
  .timeline-list::-webkit-scrollbar { width: 3px; }
  .timeline-list::-webkit-scrollbar-thumb { background: #2a2a2a; }
  .entry { padding: 7px 12px; border-left: 2px solid transparent; cursor: pointer; border-bottom: 1px solid #141414; }
  .entry:hover { background: #141414; }
  .entry.sel { background: #141414; border-left-color: #1D9E75; }
  .entry.err { border-left-color: #E24B4A !important; }
  .entry.note-e { border-left-color: #7F77DD; }
  .erow { display: flex; align-items: center; gap: 5px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; letter-spacing: .3px; }
  .eurl { font-size: 10px; color: #555; font-family: monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ets { font-size: 10px; color: #333; margin-left: auto; flex-shrink: 0; }
  .empty-msg { padding: 3rem 12px; text-align: center; color: #333; font-size: 12px; }
  .detail-pane { display: flex; flex-direction: column; overflow: hidden; background: #0c0c0c; }
  .detail-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .detail-body::-webkit-scrollbar { width: 3px; }
  .detail-body::-webkit-scrollbar-thumb { background: #2a2a2a; }
  .fl { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .fb { margin-bottom: 14px; }
  pre {
    font-size: 10px; font-family: monospace; background: #111;
    border: 1px solid #1e1e1e; border-radius: 6px; padding: 10px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    color: #7EB8D4; max-height: 200px; overflow-y: auto; line-height: 1.5;
  }
  .ann-input {
    width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 6px 10px; color: #e8e8e8; font-size: 12px; outline: none;
  }
  .ann-input:focus { border-color: #3a3a3a; }
  .err-banner {
    background: #2A0A0A; border: 1px solid #5a1a1a; border-radius: 6px;
    padding: 10px 14px; font-size: 12px; color: #F09595; margin: 12px 16px 0; display: none;
  }
  .export-btns { display: flex; gap: 6px; margin-left: auto; }
</style>
</head>
<body>

<div class="header">
  <span class="rec-dot" id="recDot"></span>
  <span class="logo">API <span>Recorder</span></span>
  <span class="rec-label" id="recLabel">ready</span>
  <span class="timer" id="timer" style="margin-left:8px">00:00</span>
</div>

<div class="err-banner" id="errBanner"></div>

<div class="controls">
  <button class="primary" id="btnStart">⏺ Start recording</button>
  <button id="btnStop" disabled>⏹ Stop</button>
  <button id="btnClear">Clear</button>
  <div class="export-btns">
    <button id="btnExportJSON">↓ JSON</button>
    <button id="btnExportHTML">↓ HTML report</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">calls</div></div>
  <div class="stat"><div class="stat-n" id="s2xx" style="color:#1D9E75">0</div><div class="stat-l">2xx ok</div></div>
  <div class="stat"><div class="stat-n" id="s4xx" style="color:#E24B4A">0</div><div class="stat-l">4xx err</div></div>
  <div class="stat"><div class="stat-n" id="s5xx" style="color:#E24B4A">0</div><div class="stat-l">5xx err</div></div>
  <div class="stat"><div class="stat-n" id="sAvg" style="color:#7F77DD">—</div><div class="stat-l">avg ms</div></div>
  <div class="stat"><div class="stat-n" id="sNotes">0</div><div class="stat-l">notes/ws</div></div>
  <div class="stat"><div class="stat-n" id="sConsole">0</div><div class="stat-l">console</div></div>
</div>

<div class="note-bar">
  <input id="noteInput" placeholder="Add test step annotation… (Enter)">
  <button id="btnAddNote">+ Add</button>
</div>

<div class="main">
  <div class="timeline-pane">
    <div class="pane-header">
      Timeline
      <div class="filter-tabs">
        <span class="ftab active" data-filter="all">All</span>
        <span class="ftab" data-filter="err">Errors</span>
        <span class="ftab" data-filter="note">Notes</span>
        <span class="ftab" data-filter="ws">WS</span>
        <span class="ftab" data-filter="console">Console</span>
      </div>
    </div>
    <div class="timeline-list" id="timeline">
      <div class="empty-msg">Start recording to capture API calls</div>
    </div>
  </div>

  <div class="detail-pane">
    <div class="pane-header" id="detailHeader">
      <span id="detailTitle">Select an entry to inspect</span>
      <button id="copyBtn" style="margin-left:auto;font-size:10px;padding:2px 8px;display:none">Copy JSON</button>
    </div>
    <div class="detail-body" id="detailBody">
      <div style="padding:3rem;text-align:center;color:#333;font-size:12px">Click any entry in the timeline</div>
    </div>
  </div>
</div>

<script src="EBML.js"></script>
<script src="fix-webm.js"></script>
<script src="recorder.js"></script>
</body>
</html>
