<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Test Recorder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f; color: #e8e8e8; padding: 16px;
  }
  .logo { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .logo span { color: #1D9E75; }
  .sub { font-size: 11px; color: #555; margin-bottom: 16px; }
  button {
    width: 100%; cursor: pointer; border: none; border-radius: 8px;
    padding: 10px; font-size: 13px; font-weight: 600;
    background: #1D9E75; color: #fff; margin-bottom: 8px;
  }
  button:hover { background: #178f68; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .note { font-size: 11px; color: #444; line-height: 1.5; margin-top: 8px; }
  .status { font-size: 12px; color: #1D9E75; margin-bottom: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="logo">API <span>Recorder</span></div>
  <div class="sub">Screen + network call recorder</div>
  <div class="status" id="status"></div>
  <button id="btn">⏺ Open Recorder</button>
  <div class="note">
    Navigate to your target page first, then click this button.
    The recorder will capture that tab's screen and all API calls.
  </div>
  <script src="popup.js"></script>
</body>
</html>
