<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Test Recorder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f; color: #e8e8e8; padding: 16px;
  }
  .logo { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .logo span { color: #1D9E75; }
  .sub { font-size: 11px; color: #555; margin-bottom: 14px; }
  .status-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-bottom: 12px; min-height: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .dot.rec { background: #E24B4A; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .status-txt { color: #aaa; }
  button {
    width: 100%; cursor: pointer; border: none; border-radius: 8px;
    padding: 10px; font-size: 13px; font-weight: 600;
    background: #1D9E75; color: #fff; margin-bottom: 8px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  button.stop { background: #E24B4A; }
  button.secondary { background: #1e1e1e; color: #bbb; }
  .note { font-size: 11px; color: #444; line-height: 1.5; margin-top: 6px; }
  .err { font-size: 11px; color: #F09595; line-height: 1.5; margin-top: 6px; min-height: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="logo">API <span>Recorder</span></div>
  <div class="sub">Screen + network call recorder</div>

  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span class="status-txt" id="status">Checking…</span>
  </div>

  <button id="btnOpen"  class="hidden">⏺ Open Recorder</button>
  <button id="btnStart" class="hidden">⏺ Start Recording</button>
  <button id="btnStop"  class="stop hidden">⏹ Stop Recording</button>
  <button id="btnFocus" class="secondary hidden">↗ Show Recorder Tab</button>

  <div class="note" id="note"></div>
  <div class="err"  id="err"></div>

  <script src="popup.js"></script>
</body>
</html>
